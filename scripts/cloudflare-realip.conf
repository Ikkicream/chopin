# cloudflare-realip.conf — restaure la VRAIE IP du visiteur derrière Cloudflare.
#
# Sans ce fichier, une fois le domaine passé par Cloudflare, nginx ne verrait que les IP
# de Cloudflare : le compteur anti-force-brute regrouperait tous les visiteurs, et
# fail2ban bannirait Cloudflare — coupure générale. Ici, nginx n'accepte l'en-tête
# CF-Connecting-IP QUE s'il vient réellement d'une plage Cloudflare (set_real_ip_from),
# ce qui empêche un client direct de forger sa provenance.
#
# À inclure dans le bloc `server` de /etc/nginx/sites-available/genesis-api.
# Plages relevées le 2026-08-21 depuis cloudflare.com/ips-v4 et ips-v6 — à resynchroniser
# de temps en temps (Cloudflare les fait évoluer rarement).

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# La vraie IP du visiteur est dans cet en-tête, posé par Cloudflare.
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
