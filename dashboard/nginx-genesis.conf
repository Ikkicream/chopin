# Config Nginx pour le dashboard Genesis
# Installer avec (sudo requis):
#   sudo cp /home/autoblog/genesis/dashboard/nginx-genesis.conf /etc/nginx/sites-available/genesis
#   sudo ln -s /etc/nginx/sites-available/genesis /etc/nginx/sites-enabled/genesis
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name genesis.mkdgroupe.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name genesis.mkdgroupe.dev;

    # Utiliser le cert paperclip si genesis.mkdgroupe.dev n'a pas le sien
    # Sinon : sudo certbot --nginx -d genesis.mkdgroupe.dev
    # ssl_certificate /etc/letsencrypt/live/genesis.mkdgroupe.dev/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/genesis.mkdgroupe.dev/privkey.pem;

    # Pour test local sans HTTPS :
    # listen 8080;
    # server_name _;

    # Authentification basique (protéger le dashboard)
    auth_basic "Genesis Dashboard";
    auth_basic_user_file /home/autoblog/genesis/dashboard/.htpasswd;

    root /home/autoblog/genesis/dashboard;
    index index.html;

    # Dashboard HTML
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JSON data (polling depuis le dashboard)
    location /data/ {
        alias /home/autoblog/genesis/data/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type "application/json";
    }

    # Pas de logs détaillés pour le JSON polling
    location ~* \.(json)$ {
        access_log off;
    }
}
